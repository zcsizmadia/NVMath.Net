name: Build & Pack

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            10.0.x

      - name: Restore
        run: dotnet restore

      # Builds library, tests and samples so compile errors in any of them fail CI.
      - name: Build
        run: dotnet build -c Release --no-restore

      # Tests are compiled above but not run: they require an NVIDIA GPU
      #- name: Test
      #  run: dotnet test -c Release --no-build

      - name: Pack
        run: dotnet pack -c Release --no-build -o nupkgs src/NVMathNet/NVMathNet.csproj

      - name: Upload package
        uses: actions/upload-artifact@v7
        with:
          name: nuget-package
          path: nupkgs/*.nupkg
